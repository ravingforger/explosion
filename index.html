<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030203"><title>Explosion</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#030203;width:100%;height:100%;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}button{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #ffffff65;border-radius:40px;padding:16px 25px;background:#141414b8;color:white;font:500 16px system-ui;cursor:pointer;white-space:nowrap;backdrop-filter:blur(12px)}button:focus-visible{outline:3px solid orange;outline-offset:4px}.quiet{opacity:.5;font-size:13px;padding:10px 16px}</style></head>
<body><video id="v" autoplay muted loop playsinline preload="auto" poster="poster.jpg?v=4"><source src="explosion.mp4?v=4" type="video/mp4"></video><button id="sound" type="button">Für Ton antippen</button>
<script>const v=document.getElementById('v'),b=document.getElementById('sound');v.play().catch(()=>{b.textContent='Explosion starten · mit Ton'});b.addEventListener('click',()=>{v.muted=!v.muted;v.play().catch(()=>{b.textContent='Zum Starten erneut tippen'});if(!v.muted){const request=document.documentElement.requestFullscreen;if(request){try{const promise=request.call(document.documentElement);if(promise)promise.catch(()=>{})}catch(e){}}}b.textContent=v.muted?'Für Ton antippen':'Ton ausschalten';b.classList.toggle('quiet',!v.muted);b.setAttribute('aria-pressed',String(!v.muted))});</script></body></html>
